# Docker Compose — run proxy + dashboard together

services:
  proxy:
    build:
      context: .
      target: builder
    image: llmproxy:latest
    command: /app/proxy
    ports:
      - "${PROXY_PORT:-8080}:8080"
    environment:
      DATABASE_URL: sqlite:///data/llmproxy.db
      PROXY_HOST: "0.0.0.0"
      PROXY_PORT: "8080"
      RUST_LOG: proxy=info,tower_http=info
    volumes:
      - llmproxy_data:/data
    restart: unless-stopped

  dashboard:
    image: llmproxy:latest
    command: /app/dashboard
    ports:
      - "${DASHBOARD_PORT:-8081}:8081"
    environment:
      DATABASE_URL: sqlite:///data/llmproxy.db
      DASHBOARD_HOST: "0.0.0.0"
      DASHBOARD_PORT: "8081"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set}"
      JWT_EXPIRY_SECS: "${JWT_EXPIRY_SECS:-86400}"
      RUST_LOG: dashboard=info,tower_http=info
    volumes:
      - llmproxy_data:/data
    depends_on:
      - proxy
    restart: unless-stopped

volumes:
  llmproxy_data:
